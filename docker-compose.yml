version: '3'
services:

  # PHP Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        user: pokemon
        uid: 1000
    image: pokemon-app
    container_name: pokemon-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - pokemon-network

  # Nginx Service
  web:
    image: nginx:alpine
    container_name: pokemon-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - pokemon-network

  # MySQL Service
  db:
    image: mysql:8.0
    container_name: pokemon-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pokemon
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: pokemon
    ports:
      - "33060:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - pokemon-network

  # phpMyAdmin Service
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pokemon-pma
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=db
      - PMA_USER=root
      - PMA_PASSWORD=root
    networks:
      - pokemon-network

networks:
  pokemon-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
